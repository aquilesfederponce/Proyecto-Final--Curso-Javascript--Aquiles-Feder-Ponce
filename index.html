<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafeteria Dublin - Inicio</title>
    <!--  CSS -->
    <link rel="stylesheet" href="./css/style.css">
    <!-- Javascript-->
    <script defer src="./js/main.js"></script>
    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Syne:wght@400..800&display=swap"
        rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Syne:wght@400..800&display=swap"
        rel="stylesheet">
</head>

<body>
    <header class="header">
        <div class="header__container">
            <img src="./assets/img/logo cafe Dublin.png" alt="" class="header__img">
            <nav class="header__nav">
                <ul class="header__ul">
                    <li class="header__li"><a class="header__a" href="#inicio">Inicio</a></li>
                    <li class="header__li"><a class="header__a" href="#productos">Productos</a></li>
                    <li class="header__li"><a class="header__a" href="./pages/carrito.html">Carrito</a></li>
                    <form class="header__form">
                        <label for="barraBusqueda">🔍</label>
                        <input type="search" class="header__search" id="barraBusqueda"
                            placeholder="Ej: Cafe Colombia Tostado">
                    </form>
                    <li class="header__li"><span class="header__contador"><span>🛒</span>0</span></li>
                </ul>
            </nav>
        </div>
    </header>

    <footer class="footer">
        <div class="footer__container">
            <img class="footer__img" src="./assets/img/logo cafe Dublin.png" alt="">
            <ul class="footer__ul">
                <li class="footer__li"><a href="#inicio" class="footer__a">Inicio</a></li>
                <li class="footer__li"><a href="#productos" class="footer__a">Productos</a></li>
                <li class="footer__li"><a href="./pages/carrito.html" class="footer__a">Mi Carrito</a></li>
            </ul>
        </div>
    </footer>
    <script src="https://kit.fontawesome.com/5e249e2dfc.js" crossorigin="anonymous"></script>
</body>

</html>
